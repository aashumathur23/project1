{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form class="panel login" method="post">
  <h1>Log in</h1>
  <p class="sub">Students use their roll number as the username.</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Log in</button>
  {% if config.ALLOW_SELF_REGISTRATION %}
  <p class="sub" style="margin:18px 0 0">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
  {% endif %}
</form>
{% endblock %}
