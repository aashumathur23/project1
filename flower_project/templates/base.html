<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Landing Page{% endblock %}</title>
  <style>
    :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6570; --accent:#2f6fed; --card:#f5f7fa; --ok:#1f8f4e; --err:#c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151a; --fg:#eef1f5; --muted:#9aa5b1; --card:#1b2028; --accent:#6c9cff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:18px 0; }
    nav a { color:var(--fg); text-decoration:none; margin-left:18px; }
    .logo { font-weight:700; font-size:1.2rem; }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; text-decoration:none; }
    .flash { padding:12px 16px; border-radius:8px; margin:16px 0; color:#fff; }
    .flash.success { background:var(--ok); } .flash.error { background:var(--err); }
    footer { color:var(--muted); text-align:center; padding:40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <span class="logo">Flower Project</span>
      <div><a href="#features">Features</a><a href="#contact">Contact</a></div>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <footer>&copy; 2026 Flower Project. All rights reserved.</footer>
  </div>
</body>
</html>
